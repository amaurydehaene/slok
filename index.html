<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Slokje</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --card-vraag: #1a1a2e;
    --accent-vraag: #c8f;
    --accent-default: #c8f;
    --accent-silly: #8fb;
    --accent-hot: #f8a;
    --accent-bar: #fc8;
    --accent-war: #f66;
    --accent-eigen: #fd6;
    --accent-virus: #f5f;
    --accent-vast: #6cf;
    --text: #f0f0f0;
    --muted: #888;
    --radius: 24px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }

  /* ── SCHERMEN ── */
  .screen { display: none; height: 100dvh; flex-direction: column; align-items: center; justify-content: center; padding: 24px 24px; }
  .screen.active { display: flex; }
  #screen-start { overflow-y: auto; justify-content: flex-start; gap: 20px; padding-top: 40px; padding-bottom: 40px; }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: -2px;
    background: linear-gradient(135deg, var(--accent-hot), var(--accent-vraag), var(--accent-silly));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tagline { color: var(--muted); font-size: 0.9rem; text-align: center; margin-top: -12px; }

  .spelers-lijst { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }

  .speler-row { display: flex; gap: 8px; align-items: center; }

  .speler-row input {
    flex: 1;
    background: #1e1e2a;
    border: 1.5px solid #333;
    border-radius: 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    padding: 12px 16px;
    outline: none;
    transition: border-color .2s;
  }
  .speler-row input:focus { border-color: var(--accent-vraag); }
  .speler-row input::placeholder { color: var(--muted); }

  .btn-remove {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.3rem;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
    transition: color .2s;
  }
  .btn-remove:hover { color: var(--accent-hot); }

  .btn-add {
    background: none;
    border: 1.5px dashed #444;
    border-radius: 12px;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 10px;
    cursor: pointer;
    width: 100%;
    max-width: 360px;
    transition: border-color .2s, color .2s;
  }
  .btn-add:hover { border-color: var(--accent-vraag); color: var(--accent-vraag); }

  .btn-start {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    border: none;
    border-radius: 16px;
    color: #fff;
    font-family: 'Syne', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 16px 48px;
    cursor: pointer;
    width: 100%;
    max-width: 360px;
    transition: transform .15s, opacity .15s;
  }
  .btn-start:active { transform: scale(0.97); opacity: 0.9; }

  .fout { color: var(--accent-hot); font-size: 0.85rem; text-align: center; min-height: 18px; }

  /* ── INSTELLINGEN (start scherm) ── */
  .instellingen-sectie { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
  .instellingen-label { font-family: 'Syne', sans-serif; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.5px; color: var(--muted); text-transform: uppercase; }

  .aantal-vragen-row { display: flex; align-items: center; gap: 14px; background: #1e1e2a; border: 1.5px solid #333; border-radius: 14px; padding: 14px 16px; }
  .aantal-vragen-row input[type="range"] { flex: 1; accent-color: #a855f7; }
  .aantal-vragen-waarde { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; min-width: 34px; text-align: right; }

  .pack-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .pack-chip {
    background: #1e1e2a;
    border: 1.5px solid #333;
    border-radius: 99px;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 9px 16px;
    cursor: pointer;
    user-select: none;
    transition: all .15s;
  }
  .pack-chip.active { color: var(--bg); border-color: transparent; }
  .pack-chip[data-pack="default"].active { background: var(--accent-default); }
  .pack-chip[data-pack="silly"].active { background: var(--accent-silly); }
  .pack-chip[data-pack="hot"].active { background: var(--accent-hot); }
  .pack-chip[data-pack="bar"].active { background: var(--accent-bar); }
  .pack-chip[data-pack="war"].active { background: var(--accent-war); }
  .pack-chip[data-pack="eigen"].active { background: var(--accent-eigen); }
  .pack-chip-count { opacity: 0.65; font-weight: 500; font-size: 0.78rem; }

  /* ── SPEL ── */
  #screen-spel { gap: 0; position: relative; }

  .progress-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: #222;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-hot), var(--accent-vraag), var(--accent-silly));
    transition: width .4s ease;
  }

  .kaart-wrapper {
    width: 100%;
    max-width: 420px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
  }

  .kaart {
    width: 100%;
    border-radius: var(--radius);
    padding: 36px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
    overflow: hidden;
    transition: transform .15s;
    cursor: pointer;
    user-select: none;
    min-height: 280px;
    justify-content: center;
    background: var(--card-vraag);
    border: 1.5px solid #2a2a45;
  }

  .kaart::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.09;
    pointer-events: none;
    background: radial-gradient(circle at top right, var(--pack-accent, var(--accent-default)), transparent 60%);
  }

  .kaart:active { transform: scale(0.98); }

  .badge-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .type-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 99px;
    width: fit-content;
    background: color-mix(in srgb, var(--pack-accent, var(--accent-default)) 18%, transparent);
    color: var(--pack-accent, var(--accent-default));
  }

  .vervolg-badge {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--muted);
    padding: 5px 10px;
    border-radius: 99px;
    background: rgba(255,255,255,0.06);
  }

  .kaart-tekst {
    font-family: 'Syne', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: -0.3px;
  }

  .virus-duur { font-size: 0.82rem; color: var(--muted); margin-top: -8px; }

  /* ── ACTIEVE VIRUSSEN ── */
  .virussen-bar {
    width: 100%;
    max-width: 420px;
    min-height: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 4px;
  }
  .virus-tag {
    background: color-mix(in srgb, var(--accent-virus) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent-virus) 30%, transparent);
    color: var(--accent-virus);
    border-radius: 99px;
    font-size: 0.72rem;
    font-weight: 500;
    padding: 4px 10px;
    display: flex;
    align-items: center;
    gap: 5px;
    animation: fadeIn .3s ease;
  }
  .virus-tag .teller { font-weight: 700; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

  .tap-hint {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    padding-bottom: 8px;
  }

  @keyframes slideIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  .kaart { animation: slideIn .3s ease; }

  /* ── DISLIKE KNOP ── */
  .dislike-wrap { width: 100%; max-width: 420px; display: flex; justify-content: center; padding-bottom: 10px; }
  .dislike-btn {
    position: relative;
    overflow: hidden;
    background: #1e1e2a;
    border: 1.5px solid #333;
    border-radius: 14px;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 12px 22px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .dislike-fill {
    position: absolute;
    left: 0; bottom: 0; right: 0;
    height: 0%;
    background: rgba(255, 90, 90, 0.35);
    transition: height .2s ease;
    z-index: 0;
  }
  .dislike-btn.filling .dislike-fill { transition: height 1s linear; height: 100%; }
  .dislike-btn span, .dislike-btn svg { position: relative; z-index: 1; }
  .dislike-btn.disliked { border-color: var(--accent-hot); color: var(--accent-hot); }

  /* ── EINDE ── */
  #screen-einde { gap: 18px; text-align: center; position: relative; overflow: hidden; }
  #screen-einde .logo-tekst { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; }
  #screen-einde p { color: var(--muted); max-width: 280px; line-height: 1.5; }

  #confetti-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

  .sixseven { display: flex; align-items: center; gap: 10px; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 5rem; letter-spacing: -3px; position: relative; z-index: 1; }
  .sixseven .six { display: inline-block; color: var(--accent-hot); animation: seesawUp 0.9s ease-in-out infinite; }
  .sixseven .seven { display: inline-block; color: var(--accent-silly); animation: seesawDown 0.9s ease-in-out infinite; }
  .sixseven .dash { color: var(--muted); }
  @keyframes seesawUp {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-22px) rotate(6deg); }
  }
  @keyframes seesawDown {
    0%, 100% { transform: translateY(-22px) rotate(6deg); }
    50% { transform: translateY(0) rotate(-6deg); }
  }

  .btn-opnieuw {
    background: #1e1e2a;
    border: 1.5px solid #333;
    border-radius: 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    padding: 14px 36px;
    cursor: pointer;
    transition: border-color .2s;
    position: relative;
    z-index: 1;
  }
  .btn-opnieuw:hover { border-color: var(--accent-vraag); }
</style>
</head>
<body>

<!-- ══ STARTSCHERM ══ -->
<div id="screen-start" class="screen active">
  <div class="logo">🍺 Slok</div>
  <p class="tagline">Vul de spelers in, kies je packs en tap je weg door de nacht</p>

  <div class="spelers-lijst" id="spelers-lijst">
    <div class="speler-row"><input type="text" placeholder="Speler 1" maxlength="20"><button class="btn-remove" onclick="verwijderSpeler(this)">×</button></div>
    <div class="speler-row"><input type="text" placeholder="Speler 2" maxlength="20"><button class="btn-remove" onclick="verwijderSpeler(this)">×</button></div>
    <div class="speler-row"><input type="text" placeholder="Speler 3" maxlength="20"><button class="btn-remove" onclick="verwijderSpeler(this)">×</button></div>
  </div>
  <button class="btn-add" onclick="voegSpelerToe()">+ Speler toevoegen</button>

  <div class="instellingen-sectie">
    <div class="instellingen-label">Aantal vragen per ronde</div>
    <div class="aantal-vragen-row">
      <input type="range" id="aantal-vragen-slider" min="5" max="100" step="5" value="25" oninput="updateAantalLabel()">
      <div class="aantal-vragen-waarde" id="aantal-vragen-waarde">25</div>
    </div>
  </div>

  <div class="instellingen-sectie">
    <div class="instellingen-label">Packs</div>
    <div class="pack-chips" id="pack-chips"></div>
  </div>

  <p class="fout" id="fout-msg"></p>
  <button class="btn-start" onclick="startSpel()">Speel!</button>
</div>

<!-- ══ SPELSCHERM ══ -->
<div id="screen-spel" class="screen">
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

  <div class="virussen-bar" id="virussen-bar"></div>

  <div class="kaart-wrapper">
    <div class="kaart" id="kaart" onclick="volgendKaart()">
      <div class="badge-row">
        <span class="type-badge" id="kaart-badge"></span>
        <span class="vervolg-badge" id="kaart-vervolg-badge" style="display:none;">↳ vervolg</span>
      </div>
      <div class="kaart-tekst" id="kaart-tekst"></div>
      <div class="virus-duur" id="kaart-virus-duur"></div>
    </div>
  </div>

  <div class="dislike-wrap">
    <div class="dislike-btn" id="dislike-btn">
      <div class="dislike-fill"></div>
      <span id="dislike-label">👎 Hou ingedrukt om te verbergen</span>
    </div>
  </div>

  <p class="tap-hint">Tap op de kaart voor de volgende</p>
</div>

<!-- ══ EINDESCHERM ══ -->
<div id="screen-einde" class="screen">
  <canvas id="confetti-canvas"></canvas>
  <div class="logo-tekst">Spel voorbij! 🎉</div>
  <p>Hopelijk zijn jullie nog (een beetje) op de been.</p>
  <div class="sixseven"><span class="six">6</span><span class="dash">-</span><span class="seven">7</span></div>
  <button class="btn-opnieuw" onclick="opnieuw()">Opnieuw spelen</button>
  <button class="btn-opnieuw" onclick="naarStart()">Instellingen aanpassen</button>
</div>

function pakketLabel(p) {
  if (PACK_INFO[p]) return PACK_INFO[p].label;
  if (EXTRA_PACK_LABELS[p]) return EXTRA_PACK_LABELS[p];

//  DISLIKES (localStorage)
// ══════════════════════════════════════════════
const DISLIKE_KEY = "slok_dislikes_v1";

function ladenDislikes() {
  try {
    const raw = localStorage.getItem(DISLIKE_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch (e) { return new Set(); }
}

function opslaanDislikes(set) {
  try { localStorage.setItem(DISLIKE_KEY, JSON.stringify([...set])); } catch (e) {}
}

let dislikes = ladenDislikes();

function vraagId(item) {
  return item.p + "|" + item.y + "|" + item.t;
}

// ══════════════════════════════════════════════
//  EIGEN / GEGARANDEERDE VRAGEN → zelfde formaat als RAW_DATA
// ══════════════════════════════════════════════
function parseVraagEntry(entry, pack) {
  if (typeof entry === 'string') {
    return {
      t: entry,
      y: 1,
      p: pack,
      n: (entry.match(/%s/g) || []).length
    };
  }
  const tekst = entry.tekst || '';
  return {
    t: tekst,
    y: 'virus',
    p: pack,
    n: (tekst.match(/%s/g) || []).length,
    duur: entry.duur || 3,
    label: entry.label || tekst
  };
}

function bouwEigenPool() {
  return EIGEN_VRAGEN.map(entry => parseVraagEntry(entry, 'eigen'));
}

function bouwGegarandeerdPool() {
  return GEGARANDEERDE_VRAGEN.map(entry => parseVraagEntry(entry, 'vast'));
}

function voegSpelerToe() {
  const lijst = document.getElementById('spelers-lijst');
  if (lijst.children.length >= 10) return;
  const n = lijst.children.length + 1;
  const row = document.createElement('div');
  row.className = 'speler-row';
  row.innerHTML = `<input type="text" placeholder="Speler ${n}" maxlength="20"><button class="btn-remove" onclick="verwijderSpeler(this)">×</button>`;
  lijst.appendChild(row);
}

function verwijderSpeler(btn) {
  const lijst = document.getElementById('spelers-lijst');
  if (lijst.children.length <= 2) return;
  btn.parentElement.remove();
}

function updateAantalLabel() {
  const slider = document.getElementById('aantal-vragen-slider');
  document.getElementById('aantal-vragen-waarde').textContent = slider.value;
}

function telPerPack() {
  const tellingen = {};
  Object.keys(PACK_INFO).forEach(p => tellingen[p] = 0);
  volledigeData.forEach(item => {
    if (!item.pk) tellingen[item.p] = (tellingen[item.p] || 0) + 1; // enkel "trekbare" (geen vervolgvragen)
  });
  return tellingen;
}

function bouwPackChips() {
  const container = document.getElementById('pack-chips');
  const tellingen = telPerPack();
  container.innerHTML = '';
  Object.keys(PACK_INFO).forEach(pack => {
    const chip = document.createElement('div');
    chip.className = 'pack-chip active';
    chip.dataset.pack = pack;
    chip.innerHTML = `${PACK_INFO[pack].label} <span class="pack-chip-count">(${tellingen[pack] || 0})</span>`;
    chip.onclick = () => chip.classList.toggle('active');
    container.appendChild(chip);
  });
}

function geselecteerdePacks() {
  return [...document.querySelectorAll('.pack-chip.active')].map(c => c.dataset.pack);
}

// ══════════════════════════════════════════════
//  DECK OPBOUWEN
// ══════════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function isNietDisliked(item) {
  return !dislikes.has(vraagId(item));
}

function bouwDeck(geselecteerd, aantal) {
  // "trekbare" items = geen parent_key (dus geen vervolgvraag), pack geselecteerd, niet disliked
  const alleTrekbaar = volledigeData.filter(item =>
    !item.pk && geselecteerd.includes(item.p) && isNietDisliked(item)
  );

  const eigenTrekbaar = alleTrekbaar.filter(item => item.p === 'eigen');
  const eigenGeselecteerd = geselecteerd.includes('eigen') && eigenTrekbaar.length > 0;

  const overigeTrekbaar = alleTrekbaar.filter(item => item.p !== 'eigen');

  let deck = [];

  if (eigenGeselecteerd) {
    let eigenWachtrij = shuffle(eigenTrekbaar);
    let eigenPtr = 0;
    let overigeWachtrij = shuffle(overigeTrekbaar);
    let overigePtr = 0;

    const volgendeEigen = () => {
      if (eigenPtr >= eigenWachtrij.length) { eigenWachtrij = shuffle(eigenTrekbaar); eigenPtr = 0; }
      return eigenWachtrij[eigenPtr++];
    };
    const volgendeOverige = () => {
      if (overigeWachtrij.length === 0) return null;
      if (overigePtr >= overigeWachtrij.length) { overigeWachtrij = shuffle(overigeWachtrij); overigePtr = 0; }
      return overigeWachtrij[overigePtr++];
    };

    while (deck.length < aantal) {
      const chunkGrootte = Math.min(EIGEN_INTERVAL, aantal - deck.length);
      const chunk = [volgendeEigen()];
      for (let i = 1; i < chunkGrootte; i++) {
        const item = volgendeOverige() || volgendeEigen();
        chunk.push(item);
      }
      deck.push(...shuffle(chunk));
    }
  } else {
    let wachtrij = shuffle(overigeTrekbaar);
    let ptr = 0;
    while (deck.length < aantal && overigeTrekbaar.length > 0) {
      if (ptr >= wachtrij.length) { wachtrij = shuffle(overigeTrekbaar); ptr = 0; }
      deck.push(wachtrij[ptr++]);
    }
  }

  return deck.slice(0, aantal);
}

function voegGegarandeerdeVragenToe(deck) {
  const teVoegen = gegarandeerdPool.filter(isNietDisliked);
  teVoegen.forEach(item => {
    const positie = Math.floor(Math.random() * (deck.length + 1));
    deck.splice(positie, 0, item);
  });
  return deck;
}

function startSpel() {
  const inputs = document.querySelectorAll('#spelers-lijst input');
  spelers = [...inputs].map(i => i.value.trim()).filter(Boolean);
  if (spelers.length < 2) {
    document.getElementById('fout-msg').textContent = 'Voeg minstens 2 spelers toe.';
    return;
  }

  const geselecteerd = geselecteerdePacks();
  if (geselecteerd.length === 0) {
    document.getElementById('fout-msg').textContent = 'Kies minstens 1 pack.';
    return;
  }

  document.getElementById('fout-msg').textContent = '';

  targetCount = parseInt(document.getElementById('aantal-vragen-slider').value, 10);
  mainDeck = bouwDeck(geselecteerd, targetCount);
  mainDeck = voegGegarandeerdeVragenToe(mainDeck);

  if (mainDeck.length === 0) {
    document.getElementById('fout-msg').textContent = 'Geen vragen beschikbaar met deze selectie.';
    return;
  }

  mainIndex = 0;
  displayQueue = [];
  huidigeKaart = null;
  actieveVirussen = [];
  updateVirussenBar();
  toonScherm('screen-spel');
  volgendKaart();
}

function opnieuw() {
  const geselecteerd = geselecteerdePacks();
  mainDeck = bouwDeck(geselecteerd, targetCount);
  mainDeck = voegGegarandeerdeVragenToe(mainDeck);
  mainIndex = 0;
  displayQueue = [];
  huidigeKaart = null;
  actieveVirussen = [];
  updateVirussenBar();
  toonScherm('screen-spel');
  volgendKaart();
}

function updateVirussenBar() {
  const bar = document.getElementById('virussen-bar');
  if (!bar) return;
  bar.innerHTML = actieveVirussen.map(v =>
    `<div class="virus-tag"><span>${v.label}</span><span class="teller">${v.resterende}</span></div>`
  ).join('');
}

function naarStart() {
  toonScherm('screen-start');
}

// ══════════════════════════════════════════════
//  KAART TONEN
// ══════════════════════════════════════════════
function volgendeUitWachtrij() {
  if (displayQueue.length > 0) return displayQueue.shift();

  if (mainIndex >= mainDeck.length) return null;

  const mainItem = mainDeck[mainIndex];
  mainIndex++;

  const kaarten = [{ ...mainItem, isVervolg: false }];

  if (mainItem.k) {
    const kinderen = (childrenByKey[mainItem.k] || []).filter(isNietDisliked);
    if (kinderen.length > 0) {
      const kind = kinderen[Math.floor(Math.random() * kinderen.length)];
      kaarten.push({ ...kind, isVervolg: true });
    }
  }

  displayQueue.push(...kaarten.slice(1));
  return kaarten[0];
}

function vervangPlaceholders(tekst) {
  if (!tekst) return '';
  let gemengd = shuffle(spelers);
  let idx = 0;
  let resultaat = tekst
    .replace(/%[st]/g, () => {
      const naam = gemengd[idx % gemengd.length];
      idx++;
      return naam || 'Iemand';
    })
    .replace(/\$/g, () => String(Math.floor(Math.random() * (STRAF_MAX - STRAF_MIN + 1)) + STRAF_MIN))
    .replace(/\s*##\s*/g, ' — ');
  return resultaat;
}

function volgendKaart() {
  // Virus op de kaart die net getoond werd activeren + alles aftellen
  if (huidigeKaart && huidigeKaart.y === 'virus') {
    actieveVirussen.push({
      label: vervangPlaceholders(huidigeKaart.label),
      resterende: huidigeKaart.duur
    });
  }
  actieveVirussen = actieveVirussen
    .map(v => ({ ...v, resterende: v.resterende - 1 }))
    .filter(v => v.resterende > 0);
  updateVirussenBar();

  const item = volgendeUitWachtrij();

  if (!item) {
    eindeSpel();
    return;
  }

  huidigeKaart = item;

  const el = document.getElementById('kaart');
  const badge = document.getElementById('kaart-badge');
  const vervolgBadge = document.getElementById('kaart-vervolg-badge');
  const tekst = document.getElementById('kaart-tekst');

  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';

  const packLabel = pakketLabel(item.p);
  const isVirusKaart = item.y === 'virus';
  el.style.setProperty('--pack-accent', isVirusKaart ? 'var(--accent-virus)' : `var(--accent-${item.p}, var(--accent-default))`);

  badge.textContent = isVirusKaart ? `${packLabel} · 🦠 Virus` : `${packLabel} · type ${item.y}`;
  vervolgBadge.style.display = item.isVervolg ? 'inline-flex' : 'none';

  tekst.textContent = vervangPlaceholders(item.t);

  const duurEl = document.getElementById('kaart-virus-duur');
  duurEl.textContent = isVirusKaart ? `Actief voor ${item.duur} kaarten` : '';

  resetDislikeKnop();

  const pct = Math.min(100, (mainIndex / mainDeck.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ══════════════════════════════════════════════
//  DISLIKE (hou 1 sec ingedrukt)
// ══════════════════════════════════════════════
let dislikeHouden = false;

function resetDislikeKnop() {
  const btn = document.getElementById('dislike-btn');
  const label = document.getElementById('dislike-label');
  btn.classList.remove('filling', 'disliked');
  dislikeHouden = false;
  label.textContent = '👎 Hou ingedrukt om te verbergen';
}

function initDislikeKnop() {
  const btn = document.getElementById('dislike-btn');
  const fill = btn.querySelector('.dislike-fill');

  const start = (e) => {
    e.preventDefault();
    if (btn.classList.contains('disliked')) return;
    dislikeHouden = true;
    btn.classList.add('filling');
  };
  const stop = () => {
    if (!dislikeHouden) return;
    dislikeHouden = false;
    if (!btn.classList.contains('disliked')) btn.classList.remove('filling');
  };

  fill.addEventListener('transitionend', (e) => {
    if (e.propertyName !== 'height') return;
    if (dislikeHouden && btn.classList.contains('filling')) {
      bevestigDislike();
    }
  });

  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointerleave', stop);
  btn.addEventListener('pointercancel', stop);
}

function bevestigDislike() {
  if (!huidigeKaart) return;
  dislikes.add(vraagId(huidigeKaart));
  opslaanDislikes(dislikes);

  const btn = document.getElementById('dislike-btn');
  const label = document.getElementById('dislike-label');
  btn.classList.add('disliked');
  label.textContent = '✓ Komt niet meer terug';
}

// ══════════════════════════════════════════════
//  EINDE SPEL
// ══════════════════════════════════════════════
function eindeSpel() {
  toonScherm('screen-einde');
  const canvas = document.getElementById('confetti-canvas');
  requestAnimationFrame(() => launchConfetti(canvas));
}

// ══════════════════════════════════════════════
//  CONFETTI (lichtgewicht, geen library)
// ══════════════════════════════════════════════
function launchConfetti(canvas) {
  const ctx = canvas.getContext('2d');
  const kleuren = ['#c8f', '#f8a', '#8fb', '#fc8', '#f66', '#fd6'];
  const dpr = window.devicePixelRatio || 1;

  function resize() {
    canvas.width = canvas.offsetWidth * dpr;
    canvas.height = canvas.offsetHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();

  const breedte = canvas.offsetWidth;
  const deeltjes = [];
  const aantal = 140;

  for (let i = 0; i < aantal; i++) {
    deeltjes.push({
      x: Math.random() * breedte,
      y: -20 - Math.random() * 200,
      vx: (Math.random() - 0.5) * 2.2,
      vy: 2 + Math.random() * 3,
      rot: Math.random() * 360,
      vrot: (Math.random() - 0.5) * 12,
      size: 6 + Math.random() * 6,
      kleur: kleuren[Math.floor(Math.random() * kleuren.length)],
      leven: 0
    });
  }

  const hoogte = canvas.offsetHeight;
  let frame = 0;
  const maxFrames = 260;

  function tick() {
    frame++;
    ctx.clearRect(0, 0, canvas.offsetWidth, canvas.offsetHeight);
    deeltjes.forEach(d => {
      d.x += d.vx;
      d.y += d.vy;
      d.rot += d.vrot;
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.rotate(d.rot * Math.PI / 180);
      ctx.fillStyle = d.kleur;
      ctx.fillRect(-d.size / 2, -d.size / 4, d.size, d.size / 2);
      ctx.restore();
    });
    if (frame < maxFrames) {
      requestAnimationFrame(tick);
    } else {
      ctx.clearRect(0, 0, canvas.offsetWidth, canvas.offsetHeight);
    }
  }
  tick();
}

// ══════════════════════════════════════════════
//  SCHERM WISSELEN
// ══════════════════════════════════════════════
function toonScherm(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
function init() {
  volledigeData = [...RAW_DATA, ...bouwEigenPool()];
  gegarandeerdPool = bouwGegarandeerdPool();
  childrenByKey = {};
  volledigeData.forEach(item => {
    if (item.pk) {
      if (!childrenByKey[item.pk]) childrenByKey[item.pk] = [];
      childrenByKey[item.pk].push(item);
    }
  });
  bouwPackChips();
  updateAantalLabel();
  initDislikeKnop();
}

init();
